<!doctype html>
<html lang="zh-CN" data-content-theme="light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f2" />
  <meta name="description" content="小小百科：通过可以暂停、比较和回看的互动演示，和孩子一起理解世界。从恒星路过黑洞开始。" />
  <title>小小百科 · 看见世界怎样运转</title>
  <script type="module" src="/src/platform/theme.ts"></script>
  <link rel="stylesheet" href="/src/catalog/catalog.css" />
</head>
<body>
  <a class="skip-link" href="#explore">跳到百科目录</a>
  <div class="catalog-shell">
    <header class="catalog-header">
      <a class="catalog-brand" href="/" aria-label="小小百科首页"><span class="brand-symbol" aria-hidden="true">✳</span><span>小小百科<small>A WORLD TO DISCOVER</small></span></a>
      <div id="catalog-appearance"></div>
    </header>
    <main>
      <section class="catalog-intro" aria-labelledby="intro-title">
        <div class="intro-copy"><p class="eyeline">观察 · 尝试 · 理解</p><h1 id="intro-title">世界有很多问题，<br>我们一起<span>看明白。</span></h1><p>让知识动起来。换一种条件，看看会发生什么；<br class="desktop-break">停在好奇的地方，慢慢聊一聊。</p></div>
        <div class="intro-sketch" aria-hidden="true"><div class="sketch-orbit orbit-one"></div><div class="sketch-orbit orbit-two"></div><div class="sketch-core"></div><i class="sketch-dot"></i><span class="sketch-star">✦</span><span class="sketch-caption">从一个小小的「为什么」开始</span></div>
      </section>
      <section id="explore" class="explore" aria-labelledby="catalog-title">
        <div class="explore-heading"><div><p class="eyeline">慢慢积累的知识花园</p><h2 id="catalog-title">从哪里开始探索？</h2></div><label class="catalog-search"><span aria-hidden="true">⌕</span><span class="sr-only">搜索百科</span><input id="search" type="search" placeholder="搜索感兴趣的问题" maxlength="160" autocomplete="off" /></label></div>
        <nav id="categories" class="category-list" aria-label="百科分类"></nav>
        <div class="collection-heading"><div><h3 id="collection-title">全部演示</h3><p id="collection-description">每个演示，从一个可以亲眼观察的问题开始。</p></div><p id="result-count" role="status" aria-live="polite"></p></div>
        <div id="topic-grid" class="topic-grid"></div>
        <div id="empty-state" class="empty-state" hidden><span aria-hidden="true">✧</span><h3 id="empty-title"></h3><p id="empty-description"></p><button id="clear-filters" type="button">查看全部演示 →</button></div>
        <button id="load-more" class="load-more" type="button" hidden>再看一些演示 ↓</button>
      </section>
      <section class="reading-note" aria-label="一起学习"><span aria-hidden="true">✳</span><div><h2>孩子看故事，大人多懂一点。</h2><p>在同一个演示里，既可以跟着画面发现变化，也可以打开学术版，了解原理、模型和资料。</p></div><span class="note-detail">可暂停 · 可回看 · 可比较</span></section>
      <noscript><p>开启 JavaScript 可使用搜索和互动动画。也可直接打开<a href="/topics/black-hole/">恒星路过黑洞</a>阅读讲解。</p></noscript>
    </main>
    <footer class="catalog-footer"><span>小小百科 · 和好奇心一起长大</span><span>从一个演示开始，逐步探索更多。</span></footer>
  </div>
  <script type="module" src="/src/catalog/main.ts"></script>
</body>
</html>
