<section class="universe-guide">
  <section class="guide-workspace" aria-label="认识宇宙成员">
    <header class="guide-toolbar">
      <label class="guide-family-field"><span>探索哪一组？</span><select id="guide-family-select" aria-label="选择一组宇宙成员"></select></label>
      <label class="guide-object-field"><span>观察对象</span><select id="guide-object-select" aria-label="选择观察对象"></select></label>
      <div class="guide-view-controls"><button id="guide-energy" aria-pressed="false" hidden>能量示意</button><button id="guide-reset">重置视角</button></div>
    </header>
    <section class="guide-case">
      <div class="guide-case-heading"><div><p id="guide-kind" class="guide-eyebrow"></p><h2 id="guide-name"></h2></div><p id="guide-label"></p></div>
      <div id="guide-stage" class="guide-stage" data-reader-stage>
        <div id="guide-fallback" class="guide-fallback" aria-hidden="true"><div id="guide-icon" class="resident-art"></div><div id="guide-partner-icon" class="resident-art"></div></div>
        <div class="guide-stage-caption guide-selected-caption"><strong id="guide-identity"></strong><span id="guide-visual-note"></span></div>
        <div class="guide-stage-caption guide-partner-caption"><span>对照观察</span><strong id="guide-partner-name"></strong><span id="guide-partner-note"></span></div>
        <span class="guide-gesture">拖动转动 · 方向键也可操作</span>
        <div class="guide-render-status"><span id="guide-render-status" role="status"></span><button id="guide-retry" hidden>重试三维画面</button></div>
      </div>
      <p id="guide-scale" class="guide-scale">大小差异经过压缩，已知天体保持大小顺序；色彩与细节是教学重建。</p>
      <p id="guide-appearance-note" class="guide-scale" hidden>为了辨认结构，辉光与纹理做了增强；星云颜色用于区分气体与尘埃，并非裸眼外观。</p>
      <div class="guide-difference"><p id="guide-contrast"></p><button id="guide-swap">换到另一边观察</button></div>
      <div class="guide-actions"><a id="guide-open" class="guide-primary">带着这个问题去观察 →</a><a id="guide-source" target="_blank" rel="noreferrer">依据与资料 ↗</a></div>
      <details class="guide-explanation"><summary>为什么看得见？它在哪里？</summary><dl class="guide-evidence"><div><dt>为什么看得见？</dt><dd id="guide-light"></dd></div><div><dt>它在哪里？</dt><dd id="guide-home"></dd></div></dl><p id="guide-clue" class="guide-clue"></p><p id="guide-texture-credit" class="guide-scale" hidden>行星与月球表面图：<a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noreferrer">Solar System Scope</a>，<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>；其余为程序绘制示意。</p></details>
    </section>
  </section>
  <section class="guide-paths" data-reader-prose><h2>四条探索路线</h2><p>每条路线有自己的问题；它们相互联系，并不表示所有天体都会沿同一条路演化。</p><div id="guide-paths"></div></section>
</section>
