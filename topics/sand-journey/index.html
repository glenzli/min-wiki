<!doctype html>
<html lang="zh-CN" data-theme="light" data-content-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沙滩上的沙子从哪里来？</title><meta name="description" content="跟着一粒小沙子，看岩石和贝壳怎样留下海边的颗粒。"><script type="module" src="/src/platform/theme.ts"></script></head><body><div id="encyclopedia-nav"></div><main><header class="hero"><p class="eyebrow">地球小发现 · 4–6 岁</p><h1>沙滩上的沙子从哪里来？</h1><p class="intro">小小一粒沙，也有一段长旅行。</p></header><section class="lab"><div class="scene-column"><div class="scene-top"><span>先猜一猜，再动手</span><strong>教学示意</strong></div><svg id="scene" viewBox="0 0 850 540" role="img" aria-label="跟着一粒小沙子，看岩石和贝壳怎样留下海边的颗粒。"></svg><div class="metrics" id="metrics"></div><div class="stage-controls"><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="观察进度"><button id="reset">回到开始</button></div></div><aside><h2>继续探索</h2><div id="stages" class="step-buttons"></div><label for="condition">跟随哪一种颗粒？</label><select id="condition"><option value="0">来自岩石</option><option value="1">来自贝壳</option></select><p class="small">换个条件，再看一次</p><button id="next" class="next">向前一步</button></aside></section><article class="discovery"><span class="spark" aria-hidden="true">✦</span><div><p class="eyebrow">一起发现</p><h2 id="story-title"></h2><p id="story" aria-live="polite"></p></div></article><details class="grownups"><summary>给大人的解释</summary><p>沙子按颗粒大小分类，常用地质粒径范围约为 0.0625–2 毫米。矿物组成并不唯一：石英很常见，许多热带海滩也含大量生物碳酸盐颗粒。不是所有沙子都经过河流，也不是所有颗粒都会变圆。</p><h2>画面与真实世界</h2><p>岩石路径和贝壳路径各展示一种可能经历，时间被大幅压缩。画面的金色不是所有沙滩的真实颜色；黑沙、白沙等都存在。</p><p>画面和真实大小、时间不成比例。</p><h2>资料依据</h2><a href="https://www.usgs.gov/publications/beaches">USGS · Beaches</a></details></main><script type="module" src="./main.ts"></script></body></html>
