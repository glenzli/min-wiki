<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" width="650" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1a2d" />
      <stop offset="60%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <radialGradient id="sunGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffb833" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ff7700" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="earthDayNight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a75d3" />
      <stop offset="48%" stop-color="#1b4d8e" />
      <stop offset="55%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="orbitArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb833" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Space -->
  <rect width="650" height="400" fill="url(#bgGrad)" />

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="45" cy="60" r="1" />
    <circle cx="120" cy="95" r="1.5" />
    <circle cx="180" cy="40" r="0.8" />
    <circle cx="280" cy="75" r="1.2" />
    <circle cx="340" cy="35" r="1.5" />
    <circle cx="410" cy="80" r="1" />
    <circle cx="560" cy="50" r="1.8" />
    <circle cx="610" cy="110" r="1.2" />
    <circle cx="75" cy="320" r="1.2" />
    <circle cx="160" cy="360" r="1.5" />
    <circle cx="240" cy="330" r="0.8" />
    <circle cx="390" cy="350" r="1.2" />
    <circle cx="490" cy="320" r="1.5" />
    <circle cx="580" cy="340" r="1" />
  </g>

  <!-- Elliptical Orbit Path -->
  <ellipse cx="280" cy="210" rx="270" ry="110" fill="none" stroke="url(#orbitArc)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.65" />

  <!-- Left Sun -->
  <circle cx="90" cy="200" r="120" fill="url(#sunGlow)" />
  <circle cx="90" cy="200" r="32" fill="#fff9e6" filter="url(#glow)" />

  <!-- Sun Rays towards Earth -->
  <path d="M125 180 L420 180 M125 200 L420 200 M125 220 L420 220" stroke="#ffb833" stroke-width="1.2" stroke-dasharray="8,8" opacity="0.45" />

  <!-- Earth Group (Tilted 23.44 degrees) -->
  <g transform="translate(460, 200) rotate(23.44)">
    <!-- North & South Pole Axis Line -->
    <line x1="0" y1="-88" x2="0" y2="88" stroke="#38efef" stroke-width="2" stroke-dasharray="4,3" opacity="0.85" />
    <!-- North Pole Arrow -->
    <polygon points="0,-92 -5,-82 5,-82" fill="#38efef" />
    <text x="8" y="-85" fill="#38efef" font-size="10" font-family="sans-serif" font-weight="600">N (北极)</text>
    <text x="8" y="90" fill="#38efef" font-size="10" font-family="sans-serif" font-weight="600">S (南极)</text>

    <!-- Earth Sphere Body -->
    <circle cx="0" cy="0" r="62" fill="url(#earthDayNight)" />

    <!-- Simplified Realistic Landmasses (Day Side Left, Night Side Right) -->
    <!-- Eurasia / Africa (Day side) -->
    <path d="M-45,-20 Q-30,-40 -15,-30 Q-5,-25 -8,-10 Q-2,-5 -15,10 Q-30,25 -42,15 Z" fill="#38a169" opacity="0.9" />
    <!-- Africa -->
    <path d="M-22,5 Q-10,0 -8,15 Q-6,32 -18,40 Q-28,30 -22,5 Z" fill="#d97706" opacity="0.85" />
    <!-- America / Pacific Ocean edge -->
    <path d="M-52,-15 Q-56,0 -48,12 Z" fill="#22c55e" opacity="0.75" />

    <!-- Clouds Swirls -->
    <path d="M-48,-32 Q-20,-28 -5,-35 Q10,-32 -2,-25 Q-30,-22 -48,-32 Z" fill="#ffffff" opacity="0.65" />
    <path d="M-40,2 Q-10,12 8,6 Q20,2 10,-2 Q-15,4 -40,2 Z" fill="#ffffff" opacity="0.55" />

    <!-- Night Side City Lights (Right side) -->
    <g fill="#ffea79" opacity="0.85" filter="url(#glow)">
      <circle cx="18" cy="-12" r="1.5" />
      <circle cx="24" cy="-8" r="1.2" />
      <circle cx="32" cy="-15" r="1.8" />
      <circle cx="38" cy="-2" r="1.4" />
      <circle cx="28" cy="18" r="1.2" />
      <circle cx="34" cy="24" r="1.5" />
      <circle cx="15" cy="5" r="1" />
    </g>

    <!-- Equator Circle -->
    <ellipse cx="0" cy="0" rx="62" ry="14" fill="none" stroke="#eab308" stroke-width="1.2" opacity="0.75" />

    <!-- Atmosphere Rim Glow -->
    <circle cx="0" cy="0" r="63" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6" filter="url(#glow)" />
  </g>

  <!-- Four Seasons Nodes on Orbit -->
  <!-- Spring Equinox (Top) -->
  <g transform="translate(280, 100)">
    <circle cx="0" cy="0" r="4" fill="#22c55e" />
    <text x="8" y="4" fill="#86efac" font-size="11" font-family="sans-serif" font-weight="600">春分 · 昼夜平分</text>
  </g>
  <!-- Summer Solstice (Right / foreground) -->
  <g transform="translate(490, 290)">
    <circle cx="0" cy="0" r="4" fill="#f59e0b" />
    <text x="8" y="4" fill="#fcd34d" font-size="11" font-family="sans-serif" font-weight="600">夏至 · 直射北回归线</text>
  </g>
  <!-- Autumn Equinox (Bottom) -->
  <g transform="translate(280, 320)">
    <circle cx="0" cy="0" r="4" fill="#eab308" />
    <text x="8" y="4" fill="#fde047" font-size="11" font-family="sans-serif" font-weight="600">秋分 · 昼夜平分</text>
  </g>
  <!-- Winter Solstice (Left / behind sun) -->
  <g transform="translate(70, 130)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <text x="8" y="4" fill="#7dd3fc" font-size="11" font-family="sans-serif" font-weight="600">冬至 · 直射南回归线</text>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(24, 32)">
    <rect width="210" height="28" rx="6" fill="#0b172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="12" y="19" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="600">◒ 地球自转与地轴倾角 23.44°</text>
  </g>
</svg>
