<section class="lab">
  <div class="scene"><span class="scene-badge">观察示意图</span><svg id="scene" viewBox="0 0 760 530" role="img" aria-label="花为什么会变成果实？"></svg></div>
  <aside class="controls"><h2>动手试试看</h2>
    <label class="control full">花粉相容性<select id="pollen"><option value="compatible">相容花粉 · 成功案例</option><option value="incompatible">不相容花粉 · 受阻案例</option></select></label>
    <div class="study-transport">
      <div class="growth-actions"><button id="journey-play" class="primary" aria-pressed="false">连续观察</button><button id="reset">回到开花时</button><button id="zoom" aria-pressed="false">放大剖面</button></div>
      <label class="growth-progress" for="journey"><span>回看生长过程</span><input id="journey" type="range" min="0" max="3000" value="0" step="1"></label>
      <p id="result" class="growth-cue" role="status" aria-live="polite"></p>
      <p class="growth-time-note">生长时间经压缩；振翅以残影示意，不按真实频率播放。拖动用于回看。</p>
    </div>
    <button id="pollinate" class="full">蜜蜂来送花粉</button><button id="next" class="full">再过一段时间</button>
    <p class="hint">先看花心，再看剖面。果实和种子分别从哪里长出来？</p>
  </aside>
</section>
