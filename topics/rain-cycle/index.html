<!doctype html>
<html lang="zh-CN" data-theme="light" data-content-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一滴水的旅行</title><meta name="description" content="从地面的水，到云里的小水滴，再回到河流和大海。"><script type="module" src="/src/platform/theme.ts"></script></head><body><div id="encyclopedia-nav"></div><main><header class="hero"><p class="eyebrow">地球小发现 · 4–6 岁</p><h1>一滴水的旅行</h1><p class="intro">水没有消失，它在换地方。</p></header><section class="lab"><div class="scene-column"><div class="scene-top"><span>先猜一猜，再动手</span><strong>教学示意</strong></div><svg id="scene" viewBox="0 0 850 540" role="img" aria-label="从地面的水，到云里的小水滴，再回到河流和大海。"></svg><div class="metrics" id="metrics"></div><div class="stage-controls"><button id="play" aria-pressed="false">慢慢走完一圈</button><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="观察进度"><button id="reset">回到开始</button></div></div><aside><h2>继续探索</h2><div id="stages" class="step-buttons"></div><label for="condition">水面得到的热量</label><select id="condition"><option value="0">温暖一些</option><option value="1">凉一些</option></select><p class="small">换个条件，再看一次</p><button id="next" class="next">向前一步</button></aside></section><article class="discovery"><span class="spark" aria-hidden="true">✦</span><div><p class="eyebrow">一起发现</p><h2 id="story-title"></h2><p id="story" aria-live="polite"></p></div></article><details class="grownups"><summary>给大人的解释</summary><p>水循环没有唯一的起点，也不是每滴水都按同一条路线走。蒸发不需要把水煮开；空气中的水蒸气本身不可见。云由小水滴或冰晶构成，这一页只画暖云降雨路径。</p><h2>画面与真实世界</h2><p>虚线和发亮的小点用来追踪水的旅行，不是水蒸气真实的可见外观。热量按钮只定性改变蒸发提示，不代表加热一点就一定会下雨。</p><p>画面和真实大小、时间不成比例。</p><h2>资料依据</h2><a href="https://www.usgs.gov/special-topics/water-science-school/science/water-cycle">USGS · Water cycle</a></details></main><script type="module" src="./main.ts"></script></body></html>
