<section class="mechanism"><div class="section-heading"><span class="number">02</span><div><p class="eyebrow">两个接触面，各有工作</p><h2>谁让车轮慢下来，谁让汽车慢下来？</h2></div></div><div class="mechanism-grid"><div class="brake-detail"><svg viewBox="0 0 450 370" role="img" aria-label="车轮剖面：刹车片夹住金属刹车盘，轮胎接触地面，地面对轮胎的摩擦力向后"><defs><radialGradient id="car-disc"><stop stop-color="#c8d1cd"/><stop offset=".72" stop-color="#eef1eb"/><stop offset="1" stop-color="#95a69f"/></radialGradient></defs><path d="M25 320H425" stroke="#869282" stroke-width="12"/><ellipse cx="220" cy="312" rx="115" ry="9" fill="#627268" opacity=".2"/><circle cx="220" cy="180" r="130" fill="#303e36"/><circle cx="220" cy="180" r="114" fill="none" stroke="#4e5d52" stroke-width="4" stroke-dasharray="3 9"/><circle cx="220" cy="180" r="88" fill="url(#car-disc)" stroke="#bdc9c0" stroke-width="3"/><circle cx="220" cy="180" r="57" fill="none" stroke="#9aa9a1" stroke-width="2"/><circle cx="220" cy="180" r="27" fill="#81958a"/><circle cx="220" cy="180" r="12" fill="#bdc7c0"/><path d="M279 123Q309 122 312 140V221Q306 235 279 235L267 216V141Z" fill="#af7357" stroke="#80523e" stroke-width="3"/><path d="M273 143V214" stroke="#d9a178" stroke-width="10"/><path d="M205 318H148L159 312M148 318L159 324" stroke="#3c8067" stroke-width="5" fill="none"/><path d="M193 305H249" stroke="#609c7a" stroke-width="6" stroke-linecap="round"/><circle cx="318" cy="133" r="16" fill="#f8ede1"/><text x="318" y="139" text-anchor="middle" fill="#885a43" font-size="18">1</text><circle cx="279" cy="304" r="16" fill="#e0ecdf"/><text x="279" y="310" text-anchor="middle" fill="#3b6751" font-size="18">2</text></svg><p class="fineprint">车向右，刹车时地面的摩擦力向左。部件大小为示意。</p></div><div class="explain-stack"><article><span class="mini-number warm">1</span><h3>刹车片和刹车盘</h3><p>刹车片夹住随车轮转动的金属盘，摩擦让车轮慢下来。运动的能量主要变成热，所以刚用过的刹车装置可能很烫，不能伸手摸。</p></article><article><span class="mini-number cool">2</span><h3>轮胎和路面</h3><p>轮胎还要抓住地面，地面才能通过摩擦让整辆车减速。正常滚动而不打滑时，轮胎接地点与地面没有相对滑动，主要是静摩擦，并不是“边滑边擦”。</p></article><p class="insight">湿滑路面常让轮胎较难抓地。本例只减小减速度，你会看到绿色的路变长；司机反应那一段并没有消失。</p></div></div></section>
