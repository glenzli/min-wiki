<section class="comparison"><div><p class="eyebrow">把刚才看到的联系起来</p><h2>同样是空气流动，条件与尺度却不同</h2><p>海陆风、台风、龙卷风并不是三个强弱等级。改变观察环境，是在比较不同的形成条件。</p></div><div class="comparison-grid"><article><h3>海岸</h3><p>受热差异形成局地环流，地形和地面物体改变它的路径。</p><button data-compare="coast">回到海岸观察</button></article><article><h3>台风</h3><p>海气能量交换与大范围旋转相互配合；强风、暴雨和风暴潮共同影响环境。</p><button data-compare="typhoon">对照台风气流</button></article><article><h3>龙卷风</h3><p>部分雷暴中形成近地面强涡旋，不能把它当成缩小的台风。</p><button data-compare="tornado">对照龙卷气流</button></article></div></section>
