<!doctype html>
<html lang="zh-CN" data-theme="light" data-content-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨水落到地上以后呢？</title><meta name="description" content="给不同的地面下一场雨，看看水流走了、渗下去了，还是留下来了。"><script type="module" src="/src/platform/theme.ts"></script></head><body><div id="encyclopedia-nav"></div><main><header class="hero"><p class="eyebrow">地球小发现 · 4–6 岁</p><h1>雨水落到地上以后呢？</h1><p class="intro">地面有小空隙，水可能从那里钻进去。</p></header><section class="lab"><div class="scene-column"><div class="scene-top"><span>先猜一猜，再动手</span><strong>教学示意</strong></div><svg id="scene" viewBox="0 0 850 540" role="img" aria-label="给不同的地面下一场雨，看看水流走了、渗下去了，还是留下来了。"></svg><div class="metrics" id="metrics"></div><div class="stage-controls"><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="观察进度"><button id="reset">回到开始</button></div></div><aside><h2>继续探索</h2><div id="stages" class="step-buttons"></div><label for="condition">选择地面</label><select id="condition"><option value="0">沙土</option><option value="1">紧实黏土</option><option value="2">铺好的石板</option></select><p class="small">换个条件，再看一次</p><button id="next" class="next">向前一步</button></aside></section><article class="discovery"><span class="spark" aria-hidden="true">✦</span><div><p class="eyebrow">一起发现</p><h2 id="story-title"></h2><p id="story" aria-live="polite"></p></div></article><details class="grownups"><summary>给大人的解释</summary><p>入渗取决于孔隙连通性、初始含水量、降雨强度等。沙土通常入渗较快，但饱和后同样可能产生径流；黏土有裂隙时也能快速入渗。本页使用固定分配比例帮助比较，不是土壤测量或洪水预测。</p><h2>画面与真实世界</h2><p>水滴是等量示意单位，画面剖面放大了土粒与空隙。只画雨后的一小段时间，不计算蒸发与后续地下水流动。</p><p>画面和真实大小、时间不成比例。</p><h2>资料依据</h2><a href="https://www.usgs.gov/special-topics/water-science-school/science/infiltration-and-water-cycle">USGS · Infiltration</a></details></main><script type="module" src="./main.ts"></script></body></html>
