<!doctype html>
<html lang="zh-CN" data-theme="light" data-content-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小河为什么弯弯曲曲？</title><meta name="description" content="让水从山坡流下来，看看它怎样绕开石头，又怎样改变河岸。"><script type="module" src="/src/platform/theme.ts"></script></head><body><div id="encyclopedia-nav"></div><main><header class="hero"><p class="eyebrow">地球小发现 · 4–6 岁</p><h1>小河为什么弯弯曲曲？</h1><p class="intro">水往低处走，河道也会慢慢变。</p></header><section class="lab"><div class="scene-column"><div class="scene-top"><span>先猜一猜，再动手</span><strong>教学示意</strong></div><svg id="scene" viewBox="0 0 850 540" role="img" aria-label="让水从山坡流下来，看看它怎样绕开石头，又怎样改变河岸。"></svg><div class="metrics" id="metrics"></div><div class="stage-controls"><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="观察进度"><button id="reset">回到开始</button></div></div><aside><h2>继续探索</h2><div id="stages" class="step-buttons"></div><label for="condition">石头放在哪里？</label><select id="condition"><option value="0">放在中间</option><option value="1">靠左放</option><option value="2">拿走石头</option></select><p class="small">换个条件，再看一次</p><button id="next" class="next">向前一步</button></aside></section><article class="discovery"><span class="spark" aria-hidden="true">✦</span><div><p class="eyebrow">一起发现</p><h2 id="story-title"></h2><p id="story" aria-live="polite"></p></div></article><details class="grownups"><summary>给大人的解释</summary><p>河流的路线受地形、岩石、河岸材料、流量和泥沙共同影响。外弯侵蚀、内弯沉积是常见的曲流特征；真实水流包含三维运动。此处不计算湍流或预测真实河道。</p><h2>画面与真实世界</h2><p>画面把俯视地形展开，并用高处与低处的标记表示坡度。泥沙和河岸变化明显加快，只表示变化方向。</p><p>画面和真实大小、时间不成比例。</p><h2>资料依据</h2><a href="https://www.usgs.gov/water-science-school/science/streamflow-and-water-cycle">USGS · Streamflow</a></details></main><script type="module" src="./main.ts"></script></body></html>
