<section class="lab"><div class="scene"><span class="scene-badge">观察示意图</span><svg id="scene" viewBox="0 0 760 530" role="img" aria-label="种子怎样去远方？"></svg></div><aside class="controls"><h2>动手试试看</h2><label class="control full">旅行方式<select id="kind"><option value="wind">蒲公英 · 搭风</option><option value="fur">牛蒡 · 搭动物</option></select></label><label class="control full">风有多大<span id="wind-label"></span><input id="wind" type="range" min="0" max="2" step="1" value="1" aria-label="风有多大"></label><button class="primary full" id="travel">出发</button><label class="control full">观察进度<input id="progress" type="range" min="0" max="1000" value="0" aria-label="观察进度"></label><button class="full" id="reset">回到出发点</button><p class="hint">同一个传播体连续移动，可以随时暂停和回看。蒲公英的冠毛是有空隙的细丝；牛蒡先接触毛发，再搭车和脱落。</p><p id="result" class="result" role="status" aria-live="polite"></p></aside></section>
