<section class="lab"><div class="scene"><span class="scene-badge">观察示意图</span><svg id="scene" viewBox="0 0 760 530" role="img" aria-label="一粒豆子怎样发芽？"></svg></div><aside class="controls"><h2>动手试试看</h2><label class="control">水分<select id="water"><option value="damp">湿润，没积水</option><option value="dry">干干的</option><option value="flood">泡在积水里</option></select></label><label class="control">空气<select id="air"><option value="yes">空气充足</option><option value="no">氧气不足</option></select></label><label class="control">温度<select id="temp"><option value="warm">温暖</option><option value="cold">太冷</option></select></label><label class="control">成长相册<input id="stage" type="range" min="0" max="3" value="0" step="any" aria-label="成长相册"></label><div class="steps"><button id="next" class="primary">看下一张</button><button id="reset">重新观察</button></div><p id="result" class="result" role="status" aria-live="polite"></p></aside></section>
